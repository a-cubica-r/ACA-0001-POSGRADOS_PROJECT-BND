# ==============================================================================
# PERFIL DE RENDIMIENTO — Solo para pruebas de carga locales
# Uso: --spring.config.additional-location=file:./performance-tests/config/
#
# ADVERTENCIA: NUNCA modificar la URL de datasource para apuntar a Railway
#              ni a ningún esquema de producción.
# ==============================================================================

# ── Base de datos de rendimiento (local) ──────────────────────────────────────
# Valores directos (mayor prioridad que application.properties)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/posgrados
spring.datasource.username=root
spring.datasource.password=12345678
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.default_schema=posgrados

# Aliases para los placeholders ${DB_URL} etc. del application.properties principal
# (si Spring no puede resolver esos placeholders, la aplicación falla al arrancar)
DB_URL=jdbc:mysql://127.0.0.1:3306/posgrados
DB_USER=root
DB_PASSWORD=12345678
DB_DRIVER=com.mysql.cj.jdbc.Driver
DB_DIALECT=org.hibernate.dialect.MySQLDialect
DB_SCHEMA=posgrados

# Hibernate recrea el esquema completo al arrancar (DROP + CREATE)
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false

# ── Logging silencioso para no distorsionar la medición ───────────────────────
logging.level.root=WARN
logging.level.ufps.edu.co=WARN
logging.level.org.springframework=WARN
logging.level.com.zaxxer.hikari=WARN

# ── Pool de conexiones expandido para carga concurrente ───────────────────────
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ── APP vars referenciadas como ${APP_NAME} etc. ──────────────────────────────
APP_NAME=Posgrados API
APP_PREFIX=/posgrados-project
APP_BASE_URL=http://localhost:8080/posgrados-project
APP_FRONTEND_LOGIN_URL=http://localhost:3000/aspirante/login
APP_FRONTEND_RESET_PASSWORD_URL=http://localhost:3000/cambiar-password/
SYSTEM_IN_DEV_MODE=true
SPRING_SECURITY_USER_NAME=admin
SPRING_SECURITY_USER_PASSWORD=1234
JWT_SECRET=perf-test-secret-must-be-at-least-32-characters-long

# Swagger — desactivado para reducir overhead
ENABLE_API_DOCS=false
ENABLE_SWAGGER_UI=false
SWAGGER_API_DOCS_PATH=/api-docs
SWAGGER_UI_PATH=/swagger-ui.html

# Mail
MAIL_FROM=noreply@perf.local

# ── Módulos (valores simbólicos, requeridos por los StartupChecks) ────────────
# Aliases ${APP_MODULE_NAME_*} + propiedades directas por si acaso
APP_MODULE_NAME_API_AUTH=api-auth
APP_MODULE_NAME_API_BASE=api-base
APP_MODULE_NAME_API_CORE=api-core
APP_MODULE_NAME_API_REST=api-rest
APP_MODULE_NAME_API_TEST=api-test
APP_MODULE_NAME_API_WOMPI=api-wompi
APP_MODULE_NAME_APPLICATION=application
APP_MODULE_NAME_CHECK_BUILDER=check-builder
APP_MODULE_NAME_MAIL_MODULE=mail-module
APP_MODULE_NAME_S3_STORAGE=s3-storage
APP_MODULE_NAME_SECURITY=security
app.module.name.api-auth=api-auth
app.module.name.api-base=api-base
app.module.name.api-core=api-core
app.module.name.api-rest=api-rest
app.module.name.api-test=api-test
app.module.name.api-wompi=api-wompi
app.module.name.application=application
app.module.name.check-builder=check-builder
app.module.name.mail-module=mail-module
app.module.name.s3-storage=s3-storage
app.module.name.security=security

# ── JWT ───────────────────────────────────────────────────────────────────────
app.jwt.secret=perf-test-secret-must-be-at-least-32-characters-long
app.jwt.issuer=ufps-posgrados
app.jwt.access-expiration-minutes=180
app.jwt.refresh-expiration-minutes=10080
app.auth.password.allow-plain-text-legacy=true
spring.security.user.name=admin
spring.security.user.password=1234

# ── URLs base (local) ─────────────────────────────────────────────────────────
spring.application.name=Posgrados API
server.servlet.context-path=/posgrados-project
app.base-url=http://localhost:8080/posgrados-project
app.frontend-login-url=http://localhost:3000/aspirante/login
app.frontend-reset-password-url=http://localhost:3000/cambiar-password/
SYSTEM_IN_DEV_MODE=true

# ── Credenciales FALSAS — servicios externos deshabilitados ───────────────────
# Las pruebas de rendimiento NO invocan AWS SES, S3 ni Wompi.
# Los valores son ficticios para que el contexto de Spring arranque sin error.

# AWS SES (SESService usa @Value directamente)
AWS_ACCESS_KEY_ID=AKIAFAKEPERFTESTONLY00
AWS_SECRET_KEY_SES=fakeSecretKeyForPerfTestDoNotUseInProduction00000
AWS_SES_FROM_EMAIL=noreply@perf.local
AWS_SES_REGION=us-east-1

# AWS S3 (S3Config usa @Value directamente)
AWS_ACCESS_KEY=AKIAFAKEPERFTESTONLY00
AWS_SECRET_KEY=fakeSecretKeyForPerfTestDoNotUseInProduction00000
AWS_BUCKET_NAME=fake-bucket-perf-test-local
AWS_REGION=us-east-1

# Resend
RESEND_API_KEY=re_fake_perf_test_key_only

# Wompi (WOMPI_SIMULATED=true activa SimulatedWompiGateway, sin llamadas reales)
WOMPI_SIMULATED=true
WOMPI_API_BASE_URL=http://localhost:9999/fake-wompi
WOMPI_CHECKOUT_BASE_URL=http://localhost:9999/fake-wompi
WOMPI_WIDGET_SCRIPT_URL=http://localhost:9999/fake-wompi
WOMPI_PUBLIC_KEY=pub_stageit_fakeperftestonly
WOMPI_PRIVATE_KEY=prv_stageit_fakeperftestonly
WOMPI_INTEGRITY_SECRET=fake_integrity_secret_perf_test_only
WOMPI_RETURN_URL=http://localhost:8080/posgrados-project/fake
WOMPI_WEBHOOK_URL=http://localhost:8080/posgrados-project/fake
WOMPI_CURRENCY=COP

# Banco (requerido por check-builder)
BANK_META_INFO_BANCOLOMBIA=61003
BANK_META_INFO_BBVA=4668
BANK_META_INFO_EXPIREDATE_CODE=96
BANK_META_INFO_GLOBALID_CODE=7709998005938
BANK_META_INFO_REFERENCE_CODE=8020
BANK_META_INFO_VALUE_CODE=3900

# ── Swagger desactivado (reduce overhead y tiempo de arranque) ────────────────
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
