# Perfil de desarrollo: SQL visible y logs DEBUG.
# Se activa con SPRING_PROFILES_ACTIVE=dev.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

logging.level.root=INFO
logging.level.ufps.edu.co=DEBUG
logging.level.ufps.edu.co.persistence=DEBUG
logging.level.ufps.edu.co.rest.controllers=DEBUG
logging.level.ufps.edu.co.rest.services=DEBUG
